sync_time:
  name: Sync Time
  description: Sync the time on Xiaomi LYWSD02 Bluetooth clocks.
  fields:
    devices:
      name: Devices
      description: MAC addresses of the Xiaomi LYWSD02 clocks to sync.
      required: true
      example: '["A4:C1:38:XX:XX:XX"]'
      selector:
        text:
          multiple: true
